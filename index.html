<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CrewCall — South Portland Metro APA</title>
<!--
  ============================================================================
  CrewCall — index.html  (public, phone-first, guided walkthrough)
  ============================================================================
  Brief: tools/claude/briefs/2026-08-24-player-team-requests.md  (T1)
  Go-forward successor to CrewFinder (Apps/TeamCaptainTinder).

  Branding: sources the shared SPM palette + components (spm-base.css) — same
  gradient header banner, 22px cards, 999px gradient-pill buttons as every other
  SPM app. App-specific bits (wizard chips, progress) override below.

  TWO PATHS (one question per screen — Typeform pattern, research-backed):
    • "I'm looking for a team"  → nights, formats, willing-to-play areas
      (positive/willingness framing + optional favorite), "about me".
    • "I need a player"         → which of YOUR current teams, skill range for
      the format(s) that team plays, "what kind of person" — ONE player/request.
      A Double Jeopardy team shows as ONE button and asks BOTH 8- & 9-ball
      ranges; a single-format team asks only its format's range.

  AUTH: NickPick magic-link model. email/APA# → link to the address on file →
  ?token= activates a durable localStorage session. Token IS the session.
  All POSTs go to the GAS apa-mailer as text/plain (never application/json).
  ============================================================================
-->
<link rel="stylesheet" href="https://southportlandmetroapa.github.io/shared/spm-base.css">
<style>
  :root{ --ok:#0a7d33; --tap:52px; }
  body{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .spm-page{ max-width:600px; flex:1; display:flex; flex-direction:column; }
  .cc-ctl{ display:flex; align-items:center; gap:8px; margin:-4px 0 12px; min-height:24px; }
  .cc-ctl .sp{ flex:1; }
  .stepno{ font-size:.78rem; color:var(--muted); letter-spacing:.3px; }
  .cc-lnk{ background:none; border:none; color:var(--muted); font:inherit; font-size:.85rem; cursor:pointer; padding:6px 8px; border-radius:10px; }
  .cc-lnk:hover{ background:#eceff5; color:var(--text); }
  .cc-prog{ height:6px; background:#e6eaf2; border-radius:99px; overflow:hidden; margin:0 0 14px; }
  .cc-prog>i{ display:block; height:100%; background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); width:0; transition:width .3s ease; }
  .screen{ background:var(--card); border:1px solid var(--border); border-radius:22px; padding:22px 20px; box-shadow:0 3px 10px rgba(0,0,0,.1); animation:pop .25s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .screen h2{ font-size:1.3rem; line-height:1.3; margin:0 0 6px; font-weight:900; letter-spacing:-.02em; }
  .hint{ color:var(--muted); margin:0 0 16px; }
  .grow{ flex:1; }
  .choice{ display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--border); border-radius:16px; padding:18px; margin-top:12px; font:inherit; cursor:pointer; min-height:var(--tap); transition:border-color .15s,background .15s; }
  .choice:hover,.choice:focus-visible{ border-color:var(--spm-accent); background:#f7f9ff; outline:none; }
  .choice b{ display:block; font-size:1.08rem; margin-bottom:2px; }
  .choice span{ color:var(--muted); font-size:.9rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  .chip{ border:2px solid var(--border); background:#fff; border-radius:999px; padding:11px 16px; font:inherit; font-size:.98rem; cursor:pointer; min-height:var(--tap); display:inline-flex; align-items:center; gap:7px; color:var(--text); }
  .chip[aria-pressed="true"]{ border-color:var(--spm-accent); background:#eef2ff; color:var(--spm-accent); font-weight:600; }
  .chip .tick{ opacity:0; font-weight:700; }
  .chip[aria-pressed="true"] .tick{ opacity:1; }
  .team{ display:block; width:100%; text-align:left; border:2px solid var(--border); background:#fff; border-radius:14px; padding:14px 16px; margin-top:10px; font:inherit; cursor:pointer; min-height:var(--tap); }
  .team[aria-pressed="true"]{ border-color:var(--spm-accent); background:#eef2ff; }
  .team b{ display:block; } .team span{ color:var(--muted); font-size:.88rem; }
  label.fld{ display:block; font-size:.9rem; color:var(--muted); margin:14px 0 6px; }
  input[type=text],input[type=email],textarea,select{ width:100%; font:inherit; padding:13px 14px; border:2px solid var(--border); border-radius:12px; background:#fff; min-height:var(--tap); color:var(--text); }
  textarea{ min-height:110px; resize:vertical; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--spm-accent); }
  .range{ display:flex; align-items:center; gap:10px; } .range select{ flex:1; } .range span{ color:var(--muted); }
  .row{ display:flex; gap:10px; margin-top:20px; }
  .btn{ flex:1; font:inherit; font-weight:700; font-size:1rem; border:none; border-radius:999px; padding:14px 20px; cursor:pointer; min-height:var(--tap); transition:filter .15s,transform .15s; }
  .btn:hover{ filter:brightness(1.08); transform:translateY(-1px); } .btn:active{ transform:translateY(0); }
  .btn.primary{ background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); color:#fff; }
  .btn.primary:disabled{ background:#c9ccd6; cursor:not-allowed; filter:none; transform:none; }
  .btn.ghost{ background:#fff; color:var(--text); border:2px solid var(--border); flex:0 0 auto; }
  .err{ color:var(--spm-primary); font-size:.9rem; margin-top:10px; min-height:1.1em; } .err.ok{ color:var(--ok); }
  .review .item{ border-top:1px solid var(--border); padding:12px 0; display:flex; gap:12px; align-items:flex-start; }
  .review .item:first-child{ border-top:none; }
  .review dt{ flex:0 0 38%; color:var(--muted); font-size:.9rem; } .review dd{ flex:1; font-weight:600; word-break:break-word; }
  .review .edit{ background:none; border:none; color:var(--spm-accent); font:inherit; font-size:.85rem; cursor:pointer; padding:0; }
  .callout{ background:#fff6f7; border:1px solid #f6c9d1; border-radius:14px; padding:12px 14px; margin-top:14px; font-size:.92rem; color:#8a1226; }
  .center{ text-align:center; } .big-emoji{ font-size:2.4rem; display:block; margin-bottom:8px; }
  .spin{ display:inline-block; width:18px; height:18px; border:3px solid #d7deea; border-top-color:var(--spm-accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; }
  @keyframes sp{ to{ transform:rotate(360deg) } }
</style>
</head>
<body>
<div class="spm-page">
  <header class="spm-header">
    <h1>CrewCall</h1>
    <p class="spm-subtitle">Find a team &middot; Find a player</p>
  </header>
  <div class="cc-ctl" id="ctl" hidden>
    <span class="stepno" id="stepNo"></span>
    <span class="sp"></span>
    <button class="cc-lnk" id="startOver" hidden>&#10005; Start over</button>
    <button class="cc-lnk" id="logout" hidden>Log out</button>
  </div>
  <div class="cc-prog" id="progWrap" hidden><i id="progBar"></i></div>
  <main id="app" class="grow"></main>
  <footer class="spm-footer">South Portland Metro APA &middot; Have Fun. Meet People. Play Pool.</footer>
</div>

<script>
"use strict";
/* ── config ─────────────────────────────────────────────────────────────── */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzGTzkBRTrIIP_tD6sbtOOUmNZkXDdtxPoO4c8fdWt5h3tZFueNSISPv8Q3LWStx73Whw/exec';
var SKEY = 'crewcall_session';   // durable session token (the magic-link token itself)
var MKEY = 'crewcall_mode';      // remember the chosen path across the email round-trip

var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var FORMATS = ['8-Ball','9-Ball','8-Ball Doubles','9-Ball Doubles','Double Jeopardy','Double Jeopardy Doubles','Masters','Ladies'];
var AREAS = ['Milwaukie','Oregon City','Tigard','Beaverton','Hillsboro'];

/* ── state ──────────────────────────────────────────────────────────────── */
var S = { token:null, signedIn:false, firstName:'', mode:null, teams:[], step:0, A:{}, view:null };
var app = document.getElementById('app');

/* ── GAS call (text/plain — no CORS preflight) ──────────────────────────── */
function gas(action, extra){
  var payload = Object.assign({ action: action }, extra || {});
  return fetch(GAS_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:'Network hiccup. Check your connection and try again.' }; });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ── header chrome ──────────────────────────────────────────────────────── */
function chrome(){
  document.getElementById('startOver').hidden = !S.mode;
  document.getElementById('logout').hidden = !S.signedIn;
  document.getElementById('ctl').hidden = !(S.mode || S.signedIn);
  var showProg = !!S.mode && S.view==='step';
  document.getElementById('progWrap').hidden = !showProg;
  var stepNo = document.getElementById('stepNo');
  if(showProg){
    var steps = activeSteps(); var n = steps.length, i = Math.min(S.step, n-1);
    stepNo.textContent = 'Step '+(i+1)+' of '+n;
    document.getElementById('progBar').style.width = Math.round(((i+1)/n)*100)+'%';
  } else stepNo.textContent = '';
}
document.getElementById('startOver').onclick = function(){
  if((S.step>0 || Object.keys(S.A).length>0) && !confirm('Start over? Your answers on this request will be cleared.')) return;
  S.mode=null; S.step=0; S.A={};
  try{ localStorage.removeItem(MKEY); }catch(e){}
  showFork();
};
document.getElementById('logout').onclick = function(){
  gas('crew_logout', { token: S.token });
  try{ localStorage.removeItem(SKEY); localStorage.removeItem(MKEY); }catch(e){}
  S.token=null; S.signedIn=false; S.mode=null; S.step=0; S.A={}; S.firstName='';
  showFork();
};

/* ── picked-team helpers (contextual skill ranges) ──────────────────────── */
function pickedTeam(){
  var id = S.A.team;
  for(var i=0;i<(S.teams||[]).length;i++){ if(String(S.teams[i].team_id)===String(id)) return S.teams[i]; }
  return null;
}
function teamPlays(ball){
  var t = pickedTeam();
  var f = (t && t.formats && t.formats.length) ? t.formats.join(' ') : '';
  if(!/[89]/.test(f)) return true;              // unknown / non-8-9 format → show both ranges
  return f.indexOf(String(ball)) >= 0;
}

/* ── step definitions (per path) ────────────────────────────────────────── */
function stepsFor(mode){
  if(mode==='seeking_team') return [
    { id:'days',    type:'multi',  required:false, options:DAYS,
      title:'Which nights can you play?', hint:'Pick all that work — leave blank if you’re flexible on nights.' },
    { id:'formats', type:'multi',  required:false, options:FORMATS,
      title:'Which formats are you up for?', hint:'Pick any that interest you, or leave blank for any.' },
    { id:'areas',   type:'multi',  required:true,  options:AREAS,
      title:'Which areas would you play in?', hint:'Pick every area you’d play in — the more you pick, the more teams we can match you with.' },
    { id:'preferred', type:'single-of-areas', required:false, options:AREAS,
      title:'Which is your first choice?', hint:'Optional — helps us match you closer to home. Tap to pick, or skip.',
      showIf:function(){ return (S.A.areas||[]).length>=2; } },
    { id:'about',   type:'textarea', required:false, max:1000,
      title:'What’s one thing you’d want a potential team to know about you?',
      hint:'A sentence or two — your vibe, experience, what you’re after. Optional.' }
  ];
  return [
    { id:'team',   type:'team',   required:true,
      title:'Which of your teams is this for?', hint:'We pulled these from your current-session roster.' },
    { id:'sl8',    type:'range',  required:false, lo:1, hi:7,
      title:'8-Ball skill range you’re looking for', hint:'Leave on “Any” if it doesn’t matter.',
      showIf:function(){ return teamPlays(8); } },
    { id:'sl9',    type:'range',  required:false, lo:1, hi:9,
      title:'9-Ball skill range you’re looking for', hint:'Leave on “Any” if it doesn’t matter.',
      showIf:function(){ return teamPlays(9); } },
    { id:'looking',type:'textarea', required:false, max:1000,
      title:'What kind of person are you looking for?',
      hint:'Reliability, vibe, availability — whatever matters to you. Optional.',
      callout:'This request is for ONE player. Need more? Finish this one, then submit another request.' }
  ];
}
function activeSteps(){ return stepsFor(S.mode).filter(function(s){ return !s.showIf || s.showIf(); }); }

/* ── screen: welcome + fork ─────────────────────────────────────────────── */
function showFork(){
  S.view='fork'; chrome();
  app.innerHTML =
    '<div class="screen">'+
      '<h2>What brings you to the table?</h2>'+
      '<p class="hint">'+(S.firstName?('Hi '+esc(S.firstName)+'! '):'')+'Pick one to get started.</p>'+
      '<button class="choice" id="fT"><b>👥 I’m looking for a team</b><span>You want to get on a roster this session.</span></button>'+
      '<button class="choice" id="fP"><b>🎱 I need a player for my team</b><span>You’re a captain who needs one more.</span></button>'+
    '</div>';
  document.getElementById('fT').onclick = function(){ pickMode('seeking_team'); };
  document.getElementById('fP').onclick = function(){ pickMode('seeking_player'); };
}
function pickMode(mode){
  S.mode=mode; S.step=0; S.A={};
  try{ localStorage.setItem(MKEY, mode); }catch(e){}
  if(!S.signedIn){ showLogin(); return; }
  if(mode==='seeking_player'){ loadTeamsThenStart(); } else { startSteps(); }
}

/* ── screen: login (email/APA → magic link) ─────────────────────────────── */
function showLogin(prefillErr){
  S.view='login'; chrome();
  app.innerHTML =
    '<div class="screen">'+
      '<h2>First, let’s confirm it’s you</h2>'+
      '<p class="hint">Enter your email or APA number. We’ll send a one-tap sign-in link to the email on file. No password.</p>'+
      '<label class="fld" for="ident">Email or APA number</label>'+
      '<input id="ident" type="text" autocomplete="email" inputmode="email" placeholder="you@example.com or 8-digit APA #">'+
      '<input id="hp" type="text" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true">'+
      '<div class="err" id="err">'+esc(prefillErr||'')+'</div>'+
      '<div class="row">'+
        '<button class="btn ghost" id="back">Back</button>'+
        '<button class="btn primary" id="send">Send my link</button>'+
      '</div>'+
    '</div>';
  document.getElementById('back').onclick = showFork;
  var send = document.getElementById('send');
  send.onclick = function(){
    var v = document.getElementById('ident').value.trim();
    var err = document.getElementById('err');
    if(!v){ err.textContent='Enter your email or APA number.'; return; }
    send.disabled=true; send.innerHTML='<span class="spin"></span>';
    gas('crew_link_request', { identifier:v, hp:document.getElementById('hp').value }).then(function(res){
      send.disabled=false; send.textContent='Send my link';
      if(!res.ok){ err.textContent=res.error||'Something went wrong. Try again.'; return; }
      showSent(v);
    });
  };
  document.getElementById('ident').addEventListener('keydown',function(e){ if(e.key==='Enter') send.click(); });
}
function showSent(dest){
  S.view='sent'; chrome();
  app.innerHTML =
    '<div class="screen center">'+
      '<span class="big-emoji">📧</span>'+
      '<h2>Check your email</h2>'+
      '<p class="hint">If we found you, a sign-in link is on its way to your email on file. Tap it on this device to keep going. The link works for 30 minutes.</p>'+
      '<div class="row"><button class="btn ghost" id="back">Back</button>'+
      '<button class="btn primary" id="resend">Resend link</button></div>'+
      '<div class="err" id="err"></div>'+
    '</div>';
  document.getElementById('back').onclick = showLogin;
  document.getElementById('resend').onclick = function(){
    var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    gas('crew_link_request', { identifier:dest }).then(function(res){
      b.disabled=false; b.textContent='Resend link';
      var err=document.getElementById('err');
      err.className='err'+(res.ok?' ok':''); err.textContent = res.ok ? 'Sent again — check your inbox.' : (res.error||'Could not resend.');
    });
  };
}

/* ── steps ──────────────────────────────────────────────────────────────── */
function loadTeamsThenStart(){
  S.view='loading'; chrome();
  app.innerHTML = '<div class="screen center"><span class="spin"></span><p class="hint" style="margin-top:12px">Finding your teams…</p></div>';
  gas('crew_my_teams', { token:S.token }).then(function(res){
    if(!res.ok){ handleSessionErr(res.error); return; }
    S.teams = res.teams||[];
    if(!S.teams.length){
      app.innerHTML = '<div class="screen"><h2>Hmm — no current team found</h2>'+
        '<p class="hint">We couldn’t find a team for you in the current session. If that’s a mistake, contact the league office and we’ll sort it out.</p>'+
        '<div class="row"><button class="btn ghost" id="b">Back</button></div></div>';
      document.getElementById('b').onclick = showFork; return;
    }
    if(S.teams.length===1){ S.A.team = S.teams[0].team_id; }  // preselect the only team
    startSteps();
  });
}
function startSteps(){ S.step=0; renderStep(); }

function renderStep(){
  S.view='step';
  var steps = activeSteps();
  if(S.step>=steps.length){ showReview(); return; }
  var st = steps[S.step];
  chrome();
  var body='';
  if(st.type==='multi' || st.type==='single-of-areas'){
    var opts = st.type==='single-of-areas' ? (S.A.areas||[]) : st.options;
    var sel = S.A[st.id];
    body = '<div class="chips">'+ opts.map(function(o){
      var on = st.type==='multi' ? (sel||[]).indexOf(o)>=0 : sel===o;
      return '<button class="chip" role="button" aria-pressed="'+(on?'true':'false')+'" data-v="'+esc(o)+'"><span class="tick">✓</span>'+esc(o)+'</button>';
    }).join('') +'</div>';
  } else if(st.type==='team'){
    body = S.teams.map(function(t){
      var on = String(S.A.team)===String(t.team_id);
      var sub = [t.format, t.night_of_play, t.division_name].filter(Boolean).join(' · ');
      return '<button class="team" aria-pressed="'+(on?'true':'false')+'" data-v="'+esc(t.team_id)+'">'+
        '<b>'+esc(t.team_name||('Team '+t.team_number))+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</button>';
    }).join('');
  } else if(st.type==='range'){
    var v = S.A[st.id]||{min:'',max:''};
    function optsFor(lo,hi,cur){ var s='<option value="">Any</option>'; for(var i=lo;i<=hi;i++){ s+='<option value="'+i+'"'+(String(cur)===String(i)?' selected':'')+'>SL '+i+'</option>'; } return s; }
    body = '<div class="range"><select id="mn">'+optsFor(st.lo,st.hi,v.min)+'</select>'+
           '<span>to</span><select id="mx">'+optsFor(st.lo,st.hi,v.max)+'</select></div>';
  } else if(st.type==='textarea'){
    body = '<textarea id="ta" maxlength="'+(st.max||1000)+'" placeholder="Type here…">'+esc(S.A[st.id]||'')+'</textarea>';
  }
  app.innerHTML =
    '<div class="screen">'+
      '<h2>'+esc(st.title)+'</h2>'+
      (st.hint?'<p class="hint">'+esc(st.hint)+'</p>':'')+
      body+
      (st.callout?'<div class="callout">'+esc(st.callout)+'</div>':'')+
      '<div class="err" id="err"></div>'+
      '<div class="row">'+
        (S.step>0?'<button class="btn ghost" id="back">Back</button>':'')+
        '<button class="btn primary" id="next">'+(S.step===steps.length-1?'Review':'Next')+'</button>'+
      '</div>'+
    '</div>';

  Array.prototype.forEach.call(app.querySelectorAll('.chip,.team'), function(el){
    el.onclick = function(){
      var val = el.getAttribute('data-v');
      if(st.type==='multi'){
        var arr = S.A[st.id]||[]; var i=arr.indexOf(val);
        if(i>=0) arr.splice(i,1); else arr.push(val);
        S.A[st.id]=arr; el.setAttribute('aria-pressed', i>=0?'false':'true');
      } else {
        var cur = st.type==='team'? S.A.team : S.A[st.id];
        var isOn = String(cur)===String(val);
        if(st.type==='team'){ S.A.team = isOn? null : val; } else { S.A[st.id] = isOn? null : val; }
        Array.prototype.forEach.call(app.querySelectorAll('.chip,.team'), function(o){ o.setAttribute('aria-pressed','false'); });
        if(!isOn) el.setAttribute('aria-pressed','true');
      }
      document.getElementById('err').textContent='';
    };
  });
  if(st.type==='range'){
    document.getElementById('mn').onchange = document.getElementById('mx').onchange = function(){
      S.A[st.id] = { min:document.getElementById('mn').value, max:document.getElementById('mx').value };
    };
  }
  if(st.type==='textarea'){ document.getElementById('ta').oninput = function(){ S.A[st.id]=this.value; }; }
  if(S.step>0) document.getElementById('back').onclick = function(){ S.step--; renderStep(); };
  document.getElementById('next').onclick = function(){
    var e = validateStep(st);
    if(e){ document.getElementById('err').textContent=e; return; }
    S.step++; renderStep();
  };
}
function validateStep(st){
  if(st.type==='multi' && st.required && !(S.A[st.id]||[]).length) return 'Pick at least one to continue.';
  if(st.type==='team' && st.required && !S.A.team) return 'Pick which team this request is for.';
  if(st.type==='range'){
    var v=S.A[st.id]; if(v && v.min && v.max && Number(v.min)>Number(v.max)) return 'The low end can’t be higher than the high end.';
  }
  return '';
}

/* ── review ─────────────────────────────────────────────────────────────── */
function fmtVal(id){
  var a=S.A;
  if(id==='days')    return (a.days||[]).join(', ') || 'Flexible';
  if(id==='formats') return (a.formats||[]).join(', ') || 'Any';
  if(id==='areas')   return (a.areas||[]).join(', ');
  if(id==='preferred') return a.preferred || 'No preference';
  if(id==='about')   return a.about || '—';
  if(id==='team'){ var t=pickedTeam(); return t?(t.team_name||('Team '+t.team_number)):'—'; }
  if(id==='sl8'||id==='sl9'){ var v=a[id]||{}; if(!v.min && !v.max) return 'Any'; return 'SL '+(v.min||'?')+' to '+(v.max||'?'); }
  if(id==='looking') return a.looking || '—';
  return '';
}
function showReview(){
  S.view='review'; chrome();
  var steps = activeSteps();
  var rows = steps.map(function(st,idx){
    return '<div class="item"><dt>'+esc(shortLabel(st))+'</dt><dd>'+esc(fmtVal(st.id))+
      ' <button class="edit" data-i="'+idx+'">Edit</button></dd></div>';
  }).join('');
  app.innerHTML =
    '<div class="screen review">'+
      '<h2>Look good?</h2>'+
      '<p class="hint">Double-check, then send it in. We’ll email you a copy.</p>'+
      '<dl>'+rows+'</dl>'+
      '<div class="err" id="err"></div>'+
      '<div class="row"><button class="btn ghost" id="back">Back</button>'+
      '<button class="btn primary" id="submit">Send my request</button></div>'+
    '</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.edit'), function(b){
    b.onclick=function(){ S.step=Number(b.getAttribute('data-i')); renderStep(); };
  });
  document.getElementById('back').onclick = function(){ S.step=steps.length-1; renderStep(); };
  document.getElementById('submit').onclick = submit;
}
function shortLabel(st){
  return { days:'Nights', formats:'Formats', areas:'Areas', preferred:'First choice',
           about:'About you', team:'Team', sl8:'8-Ball SL', sl9:'9-Ball SL', looking:'Looking for' }[st.id] || st.id;
}

/* ── submit ─────────────────────────────────────────────────────────────── */
function submit(){
  var b=document.getElementById('submit'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  var payload = { token:S.token, kind:S.mode, source:'crewcall-web' };
  if(S.mode==='seeking_team'){
    payload.days=S.A.days||[]; payload.formats=S.A.formats||[]; payload.areas=S.A.areas||[];
    payload.preferred_area=S.A.preferred||''; payload.about=S.A.about||'';
  } else {
    payload.team_id=S.A.team;
    payload.sl8_min=(S.A.sl8||{}).min||''; payload.sl8_max=(S.A.sl8||{}).max||'';
    payload.sl9_min=(S.A.sl9||{}).min||''; payload.sl9_max=(S.A.sl9||{}).max||'';
    payload.looking_for=S.A.looking||'';
  }
  gas('crew_submit', payload).then(function(res){
    b.disabled=false; b.textContent='Send my request';
    if(!res.ok){
      if(/session/i.test(res.error||'')){ handleSessionErr(res.error); return; }
      document.getElementById('err').textContent = res.error||'Something went wrong. Try again.'; return;
    }
    showDone();
  });
}
function showDone(){
  S.view='done'; S.step=0; var wasMode=S.mode; S.mode=null; S.A={};
  try{ localStorage.removeItem(MKEY); }catch(e){}
  chrome();
  app.innerHTML =
    '<div class="screen center">'+
      '<span class="big-emoji">🎉</span>'+
      '<h2>You’re all set!</h2>'+
      '<p class="hint">Your request is in and we emailed you a copy. We’ll help make the connection. '+
        (wasMode==='seeking_player'?'Need another player? Submit a second request below.':'Good luck out there!')+'</p>'+
      '<div class="row"><button class="btn primary" id="again">Submit another request</button></div>'+
    '</div>';
  document.getElementById('again').onclick = showFork;
}

/* ── session error recovery ─────────────────────────────────────────────── */
function handleSessionErr(msg){
  try{ localStorage.removeItem(SKEY); }catch(e){}
  S.token=null; S.signedIn=false;
  showLogin(msg||'Your session expired. Sign in again to finish.');
}

/* ── boot: resolve session (magic-link token or stored) ─────────────────── */
function boot(){
  var urlToken = new URLSearchParams(location.search).get('token');
  var stored = null; try{ stored = localStorage.getItem(SKEY); }catch(e){}
  var tok = urlToken || stored;
  try{ S.mode = localStorage.getItem(MKEY) || null; }catch(e){}
  if(urlToken){ history.replaceState(null,'',location.pathname); }
  if(!tok){ showFork(); return; }
  app.innerHTML = '<div class="screen center"><span class="spin"></span><p class="hint" style="margin-top:12px">Signing you in…</p></div>';
  gas('crew_verify', { token:tok }).then(function(res){
    if(!res.ok){
      try{ localStorage.removeItem(SKEY); }catch(e){}
      if(urlToken) showLogin(res.error||'That link didn’t work. Request a fresh one.'); else showFork();
      return;
    }
    S.token=tok; S.signedIn=true; S.firstName=res.first_name||'';
    try{ localStorage.setItem(SKEY, tok); }catch(e){}
    if(S.mode==='seeking_player'){ loadTeamsThenStart(); }
    else if(S.mode==='seeking_team'){ startSteps(); }
    else showFork();
  });
}
boot();
</script>
